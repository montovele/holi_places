services:
  mysql:
    image: mysql:8.4
    container_name: holi-places-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-holi_places}
      MYSQL_USER: ${MYSQL_USER:-holi_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-holi_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-holi_local_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - holi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  holi-mysql-data: